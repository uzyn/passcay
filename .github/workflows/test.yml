name: Tests

# Run once per change: pushes only on main (e.g. after merge), and pull_request
# for everything else. PRs from forks/other contributors trigger pull_request,
# so they are still covered; branches in this repo run only via their PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        zig-version: [0.16.0, master]

    name: ${{ matrix.os }} / Zig ${{ matrix.zig-version }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@main
        with:
          version: ${{ matrix.zig-version }}

      - name: Build library
        run: zig build

      - name: Run tests
        run: zig build test --summary all

      - name: Check formatting
        run: zig fmt --check .
